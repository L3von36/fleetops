name: Build & Release

# Build all platform targets on every push to main (fast smoke: Android + Web + Pages)
# and on version tags (full matrix + GitHub Release with all installers).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'
  FLUTTER_CHANNEL: 'stable'

jobs:
  # ---------------------------------------------------------------- Android
  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Decode release keystore (from repo secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/fleetops-release-key.jks"
            cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/fleetops-release-key.jks
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KS_KEYPASS
          EOF
            echo "Release signing: ENABLED (keystore from secrets)"
          else
            echo "Release signing: NOT configured — falling back to debug keys"
          fi

      - name: Build release APK (signed)
        run: flutter build apk --release

      - name: Build release App Bundle (signed)
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "FleetOps-Android-${GITHUB_REF_NAME}.apk"
          AAB=$(find build/app/outputs -type f -name "*.aab" | head -1)
          echo "AAB found at: $AAB"
          cp "$AAB" "FleetOps-Android-${GITHUB_REF_NAME}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: FleetOps-Android
          path: |
            FleetOps-Android-*.apk
            FleetOps-Android-*.aab
          if-no-files-found: error

  # -------------------------------------------------------------------- Web
  build-web:
    name: Web (CanvasKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build web (repo-scoped base href)
        run: |
          flutter build web --release \
            --base-href="/${GITHUB_REPOSITORY##*/}/"

      - name: Zip web build
        run: |
          cd build/web
          zip -rq "$GITHUB_WORKSPACE/FleetOps-Web-${GITHUB_REF_NAME}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: FleetOps-Web
          path: FleetOps-Web-*.zip
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ---------------------------------------------------------------- Windows
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "FleetOps-Windows-${env:GITHUB_REF_NAME}-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FleetOps-Windows
          path: FleetOps-Windows-*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        run: flutter build linux --release

      - name: Tar bundle
        run: |
          tar -czf "FleetOps-Linux-${GITHUB_REF_NAME}-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: FleetOps-Linux
          path: FleetOps-Linux-*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS release
        run: flutter build macos --release

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r -q -y "$GITHUB_WORKSPACE/FleetOps-macOS-${GITHUB_REF_NAME}.zip" fleetops.app

      - uses: actions/upload-artifact@v4
        with:
          name: FleetOps-macOS
          path: FleetOps-macOS-*.zip
          if-no-files-found: error

  # -------------------------------------------------------- GitHub Release
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-web, build-windows, build-linux, build-macos]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FleetOps-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **FleetOps — role-based Fleet Management System (Flutter)**

            One codebase → every platform. Demo build with mocked data and a live
            telemetry simulator (positions stream every 2 s).

            ## 📦 Downloads
            | File | Platform | Install |
            | --- | --- | --- |
            | `FleetOps-Android-*.apk` | Android 7.0+ | Enable "Install unknown apps", open the APK |
            | `FleetOps-Android-*.aab` | Google Play | Upload via Play Console |
            | `FleetOps-Windows-*.zip` | Windows 10/11 x64 | Unzip → run `fleetops.exe` |
            | `FleetOps-macOS-*.zip` | macOS (Apple Silicon + Intel) | Unzip → right-click `fleetops.app` → **Open** (unsigned build) |
            | `FleetOps-Linux-*.tar.gz` | Linux x64 | `mkdir app && tar -xzf *.tar.gz -C app && ./app/fleetops` |
            | `FleetOps-Web-*.zip` | Any browser | Unzip → `python -m http.server 8080` → open `http://localhost:8080` |

            🌐 **Live web demo:** https://l3von36.github.io/fleetops/

            ## 🚀 Quick tour
            1. Sign in with any credentials (mocked), or use the **Quick demo** chips.
            2. Try different roles — Fleet Manager, Dispatcher, Driver, Executive —
               each gets its own dashboard and filtered navigation (RBAC).
            3. Toggle **dark mode** in the top bar for the best operations look.

            > ⚠️ The macOS/Windows/Linux builds are not code-signed — expect a
            > Gatekeeper/SmartScreen prompt on first launch.
          fail_on_unmatched_files: true

  # ----------------------------------------------------------- GitHub Pages
  deploy-web:
    name: Deploy web demo (Pages)
    runs-on: ubuntu-latest
    needs: build-web
    # Deploy only from main pushes — a tag points at an already-deployed
    # commit, and concurrent deploys of the same Pages site race/fail.
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
